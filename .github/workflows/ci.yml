# Intégration continue d'Apex Maint : Windows et Linux.
#  - à chaque push sur main / pull request : formatage, clippy (avertissements bloquants), tests,
#    contrôle syntaxique de l'IHM ;
#  - installateur Windows, paquet DEB et signature : ajoutés en phase 8 (voir docs/PLAN.md),
#    sur le modèle d'Apex Supervision.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ihm:
    name: IHM web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrôle syntaxique JavaScript
        run: for f in static/*.js; do node --check "$f"; done
