name: Vérifications et paquets
on: [push, pull_request, workflow_dispatch]
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  js:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: for f in static/*.js; do node --check "$f"; done
      - run: node --test tests/*.test.js
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch --locked
      - shell: powershell
        run: packaging/windows/build-installer.ps1 -SansSignature
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*
  deb:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - run: cargo fetch --locked
      - run: sh packaging/linux/build-deb.sh
      - run: sh packaging/linux/test-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.runner }}
          path: dist/*
