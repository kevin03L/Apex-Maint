  <!-- EN-TÊTE SUPÉRIEUR -->
  <header class="top">
    <button id="navToggle" class="ib" type="button" aria-label="Replier ou déplier le menu" aria-controls="mainNav" data-action="toggle-nav">
      <svg class="i"><use href="#i-menu"/></svg>
    </button>
    <div class="logo" aria-hidden="true">M</div>
    <div class="brand"><span id="appName">Apex Maint</span><small id="appSubtitle">GMAO</small></div>
    <span class="spacer"></span>
    <label class="chip site-chip" for="siteSelect">
      <svg class="i"><use href="#i-site"/></svg>
      <select id="siteSelect" disabled aria-label="Site">
        <option value="">Tous les sites</option>
      </select>
    </label>
    <span id="serverPill" class="ws-pill offline" role="status" aria-live="polite"><span class="dot"></span><span class="lab">Connexion…</span></span>
    <span id="clock" class="clock"></span>
    <button id="themeToggle" class="ib" type="button" aria-label="Passer au thème clair" data-action="toggle-theme">
      <svg class="i"><use href="#i-sun"/></svg>
    </button>
    <div class="user-menu-wrap">
      <button id="userBtn" class="user-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu utilisateur" data-action="toggle-user-menu">
        <span class="avatar" id="userBtnAvatar"><svg class="i"><use href="#i-user"/></svg></span>
        <span class="lab" id="userBtnLabel">Non connecté</span>
        <span class="user-role-badge" id="userBtnRole"></span>
      </button>
      <div id="userDropdown" class="user-dropdown" hidden>
        <div class="user-dropdown-header">
          <div class="user-dropdown-name" id="userDropdownName"></div>
          <div class="user-dropdown-sub" id="userDropdownSub"></div>
        </div>
        <div class="user-dropdown-divider"></div>
        <a href="#/profil" class="user-dropdown-item" data-action="close-user-menu">
          <svg class="i"><use href="#i-user"/></svg>
          <span>Mon profil</span>
        </a>
        <button type="button" class="user-dropdown-item" data-action="open-own-password-modal">
          <svg class="i"><use href="#i-key"/></svg>
          <span>Changer mon mot de passe</span>
        </button>
        <div class="user-dropdown-divider"></div>
        <button type="button" class="user-dropdown-item item-danger" data-action="logout">
          <svg class="i"><use href="#i-logout"/></svg>
          <span>Se déconnecter</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MENU GAUCHE REPLIABLE (rempli par app.js) -->
  <nav id="mainNav" aria-label="Navigation principale"></nav>
  <div id="navBackdrop" class="nav-backdrop" hidden data-action="close-mobile-nav"></div>

  <!-- ZONE PRINCIPALE -->
  <main id="view" tabindex="-1"></main>

  <!-- BARRE D'ÉTAT -->
  <footer class="status">
    <span><svg class="i"><use href="#i-server"/></svg> <span id="statusProduct">Apex Maint</span> <span id="statusVersion" class="mono"></span></span>
    <span class="spacer"></span>
    <span id="statusCheck" class="hint"></span>
  </footer>

  <!-- SURCOUCHE AUTHENTIFICATION PLEIN ÉCRAN (Connexion & Mot de passe obligatoire) -->
  <div id="authOverlay" class="auth-overlay" hidden>
    <div id="authContent" class="auth-card"></div>
  </div>

  <!-- MODALE GÉNÉRIQUE -->
  <div id="modalOverlay" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title"></h2>
        <button type="button" class="ib modal-close" aria-label="Fermer" data-action="close-modal">
          <svg class="i"><use href="#i-x"/></svg>
        </button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <!-- CONTENEUR DE NOTIFICATIONS TOAST -->
  <div id="toastBox" class="toast-box" role="status" aria-live="polite"></div>
</body>
</html>
